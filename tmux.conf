# source-file ~/configs/.tmux.reset.conf
unbind C-b
set -g prefix C-x
bind -n C-x send-prefix
# using hjkl to navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# split pane in current directory
unbind %
bind % split-window -h -c "#{pane_current_path}" "zsh --rcs /data/configs/tmux_conda_split.sh"
unbind '"'
bind '"' split-window -c "#{pane_current_path}" "zsh --rcs /data/configs/tmux_conda_split.sh"
# create new tag
bind C-c new-window

set-option -sg escape-time 10
# right bottom corner status format
set -g status-interval 60
WEATHER='#(curl wttr.in/Yonghe,New_Taipei_City?format="%%c+%%t&period=60")'
set -g status-right "$WEATHER %B-%d %A %H:%M"
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'seebi/tmux-colors-solarized'

# outfit of focus pane
set -g pane-active-border-style fg=yellow,bold

# Start windows (tabs) and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when a window is closed
set -g renumber-windows on

set -g mouse on
# bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
# bind -n WheelDownPane select-pane -t= \; send-keys -M
# bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down

set set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xsel -i -p"
# bind -T copy-mode-vi C-Enter send-keys -X copy-pipe-and-cancel "xsel -i -b ; xsel -o -b"
# bind -T copy-mode-vi C-Enter send-keys -X copy-pipe-and-cancel "$yank_paste"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel -i -p"


# reload tmux conf
bind r source-file ${HOME}/.tmux.conf \; display-message "source-file reloaded"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
